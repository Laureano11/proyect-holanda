<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Stealth - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#09090b', // Zinc 950 (Casi negro puro)
                        surface: '#18181b', // Zinc 900
                        border: '#27272a', // Zinc 800
                        primary: '#6366f1', // Indigo (Elegante)
                        accent: '#818cf8', 
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-bg text-gray-300 pb-20">

    <nav class="sticky top-0 z-40 bg-bg/80 backdrop-blur-xl border-b border-border px-6 py-4 flex justify-between items-center">
        <h1 class="text-white font-medium tracking-wide">BASANTA<span class="text-primary">.CLUB</span></h1>
        <button class="text-gray-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" /></svg>
        </button>
    </nav>

    <div class="border-b border-border">
        <div class="flex overflow-x-auto hide-scroll px-4">
            <button class="px-6 py-4 text-white text-sm font-medium border-b-2 border-primary whitespace-nowrap">
                Hoy
            </button>
            <button class="px-6 py-4 text-gray-500 hover:text-gray-300 text-sm font-medium border-b-2 border-transparent whitespace-nowrap transition">
                Mañana
            </button>
            <button class="px-6 py-4 text-gray-500 hover:text-gray-300 text-sm font-medium border-b-2 border-transparent whitespace-nowrap transition">
                Dom 13
            </button>
             <button class="px-6 py-4 text-gray-500 hover:text-gray-300 text-sm font-medium border-b-2 border-transparent whitespace-nowrap transition">
                Lun 14
            </button>
        </div>
    </div>

    <main class="max-w-md mx-auto p-4 space-y-12 mt-6">

        <section>
            <div class="flex justify-between items-end mb-6 px-2">
                <div>
                    <h2 class="text-2xl font-light text-white">Court Central</h2>
                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-primary"></span> Indoor Panorámica
                    </p>
                </div>
                <div class="text-right">
                    <span class="block text-lg font-medium text-white">$20.000</span>
                    <span class="text-[10px] text-gray-600 uppercase tracking-wider">90 min</span>
                </div>
            </div>

            <div class="bg-surface rounded-none sm:rounded-xl border border-border overflow-hidden divide-y divide-border">
                
                <div class="group flex items-center justify-between p-5 hover:bg-white/5 transition cursor-pointer" onclick="openModal('18:30', 'Court Central')">
                    <div class="flex items-center gap-4">
                        <span class="text-lg font-medium text-white">18:30</span>
                        <span class="px-2 py-0.5 rounded text-[10px] bg-primary/10 text-primary border border-primary/20">Libre</span>
                    </div>
                    <button class="text-sm text-gray-400 group-hover:text-white transition flex items-center gap-1">
                        Reservar <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>

                <div class="flex items-center justify-between p-5 bg-black/20 opacity-50 cursor-not-allowed">
                    <div class="flex items-center gap-4">
                        <span class="text-lg font-medium text-gray-600 line-through">20:00</span>
                    </div>
                    <span class="text-xs text-gray-700 font-medium uppercase">Ocupado</span>
                </div>

                <div class="group flex items-center justify-between p-5 hover:bg-white/5 transition cursor-pointer" onclick="openModal('21:30', 'Court Central')">
                    <div class="flex items-center gap-4">
                        <span class="text-lg font-medium text-white">21:30</span>
                        <span class="px-2 py-0.5 rounded text-[10px] bg-primary/10 text-primary border border-primary/20">Libre</span>
                    </div>
                    <button class="text-sm text-gray-400 group-hover:text-white transition flex items-center gap-1">
                        Reservar <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>

                 <div class="group flex items-center justify-between p-5 hover:bg-white/5 transition cursor-pointer" onclick="openModal('23:00', 'Court Central')">
                    <div class="flex items-center gap-4">
                        <span class="text-lg font-medium text-white">23:00</span>
                        <span class="px-2 py-0.5 rounded text-[10px] bg-primary/10 text-primary border border-primary/20">Libre</span>
                    </div>
                    <button class="text-sm text-gray-400 group-hover:text-white transition flex items-center gap-1">
                        Reservar <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>

            </div>
        </section>

        <section class="opacity-75 hover:opacity-100 transition duration-500">
             <div class="flex justify-between items-end mb-6 px-2">
                <div>
                    <h2 class="text-2xl font-light text-white">Court Azul</h2>
                    <p class="text-xs text-gray-500 mt-1 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span> Outdoor Cemento
                    </p>
                </div>
                 <div class="text-right">
                    <span class="block text-lg font-medium text-white">$18.000</span>
                </div>
            </div>

            <div class="bg-surface rounded-none sm:rounded-xl border border-border overflow-hidden divide-y divide-border">
                <div class="p-8 text-center">
                    <p class="text-gray-500 text-sm">No quedan turnos disponibles.</p>
                    <button class="mt-4 text-xs text-primary border-b border-primary pb-0.5 hover:text-white hover:border-white transition">Ver disponibilidad mañana</button>
                </div>
            </div>
        </section>

    </main>

    <div id="bookingModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <div class="absolute bottom-0 w-full bg-surface border-t border-border p-8 sm:static sm:m-auto sm:max-w-md sm:rounded-xl sm:border transform transition-transform duration-300">
            
            <div class="flex justify-between items-start mb-8">
                <div>
                    <span class="text-primary text-xs font-bold uppercase tracking-widest">Confirmar Reserva</span>
                    <h3 class="text-3xl font-light text-white mt-2" id="modalTime">18:30</h3>
                    <p class="text-gray-400 text-sm mt-1" id="modalCourt">Court Central</p>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-medium text-white">$20.600</p>
                    <p class="text-[10px] text-gray-600 uppercase">Total Final</p>
                </div>
            </div>

            <button class="w-full bg-white hover:bg-gray-200 text-black font-medium py-4 rounded flex items-center justify-center gap-3 transition">
                <span>Pagar ahora</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </button>
            
            <button onclick="closeModal()" class="w-full mt-4 py-3 text-sm text-gray-500 hover:text-white transition">Cancelar</button>
        </div>
    </div>

    <script>
        function openModal(time, court) {
            document.getElementById('modalTime').innerText = time;
            document.getElementById('modalCourt').innerText = court;
            const modal = document.getElementById('bookingModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'items-end', 'sm:items-center', 'justify-center');
        }

        function closeModal() {
            const modal = document.getElementById('bookingModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'items-end', 'sm:items-center', 'justify-center');
        }
    </script>
</body>
</html>
