{% extends 'base.html' %}

{% block title %}Crear Cuenta{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md">
        <!-- Logo / Título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-500 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">Crear Cuenta</h1>
            <p class="text-slate-400 mt-2">Registrate para empezar a reservar</p>
        </div>
        
        <!-- Card -->
        <div class="bg-slate-800/50 backdrop-blur-xl rounded-2xl p-8 border border-slate-700/50 shadow-2xl">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <!-- Rol Switch -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-3">Tipo de cuenta</label>
                    <div class="grid grid-cols-3 gap-2 p-1 bg-slate-900/50 rounded-xl">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rol" value="cliente" class="peer sr-only" checked>
                            <div class="py-2 px-3 text-center rounded-lg text-slate-400 peer-checked:bg-cyan-500 peer-checked:text-white transition font-medium text-sm">
                                Cliente
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rol" value="staff" class="peer sr-only">
                            <div class="py-2 px-3 text-center rounded-lg text-slate-400 peer-checked:bg-amber-500 peer-checked:text-white transition font-medium text-sm">
                                Staff
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rol" value="admin" class="peer sr-only">
                            <div class="py-2 px-3 text-center rounded-lg text-slate-400 peer-checked:bg-purple-500 peer-checked:text-white transition font-medium text-sm">
                                Admin
                            </div>
                        </label>
                    </div>
                </div>
                
                <!-- Complejo (si hay complejos disponibles) -->
                {% if complejos %}
                <div>
                    <label for="complejo" class="block text-sm font-medium text-slate-300 mb-2">Complejo</label>
                    <select 
                        id="complejo" 
                        name="complejo"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                    >
                        <option value="">Seleccionar complejo...</option>
                        {% for complejo in complejos %}
                        <option value="{{ complejo.id }}">{{ complejo.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}
                
                <!-- Nombre y Apellido -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-slate-300 mb-2">Nombre</label>
                        <input 
                            type="text" 
                            id="first_name" 
                            name="first_name"
                            class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                            placeholder="Juan"
                        >
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-slate-300 mb-2">Apellido</label>
                        <input 
                            type="text" 
                            id="last_name" 
                            name="last_name"
                            class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                            placeholder="Pérez"
                        >
                    </div>
                </div>
                
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Usuario *</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="juanperez"
                    >
                </div>
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="juan@ejemplo.com"
                    >
                </div>
                
                <!-- Celular -->
                <div>
                    <label for="celular" class="block text-sm font-medium text-slate-300 mb-2">Celular</label>
                    <input 
                        type="tel" 
                        id="celular" 
                        name="celular"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="+54 9 11 1234-5678"
                    >
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Contraseña *</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="••••••••"
                    >
                </div>
                
                <!-- Submit -->
                <button 
                    type="submit" 
                    class="w-full py-2.5 px-4 bg-cyan-500 text-white font-medium rounded-lg hover:bg-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
                >
                    Crear Cuenta
                </button>
            </form>
            
            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-600"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-slate-800/50 text-slate-400">o</span>
                </div>
            </div>
            
            <!-- Login link -->
            <div class="text-center">
                <p class="text-slate-400">
                    ¿Ya tenés cuenta? 
                    <a href="{% url 'login' %}" class="text-cyan-400 hover:text-cyan-300 font-medium transition">
                        Iniciá sesión
                    </a>
                </p>
            </div>
        </div>
        
        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="{% url 'home' %}" class="text-slate-500 hover:text-slate-300 text-sm transition">
                ← Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
