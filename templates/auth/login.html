{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo / Título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-500 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">Bienvenido</h1>
            <p class="text-slate-400 mt-2">Iniciá sesión para gestionar tus turnos</p>
        </div>
        
        <!-- Card -->
        <div class="bg-slate-800/50 backdrop-blur-xl rounded-2xl p-8 border border-slate-700/50 shadow-2xl">
            <form method="post" class="space-y-6" autocomplete="on">
                {% csrf_token %}
                
                <!-- Email or Username -->
                <div>
                    <label for="id_username" class="block text-sm font-medium text-slate-300 mb-2">Email o Usuario</label>
                    <input 
                        type="email" 
                        id="id_username" 
                        name="username" 
                        required
                        autocomplete="email"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="tu@email.com"
                    >
                </div>
                
                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="id_password" class="block text-sm font-medium text-slate-300">Contraseña</label>
                        <a href="{% url 'password_reset' %}" class="text-xs text-cyan-400 hover:text-cyan-300 transition">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                    <input 
                        type="password" 
                        id="id_password" 
                        name="password" 
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="••••••••"
                    >
                </div>
                
                <!-- Submit -->
                <button 
                    type="submit" 
                    class="w-full py-2.5 px-4 bg-cyan-500 text-white font-medium rounded-lg hover:bg-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
                >
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-600"></div>
                </div>
                <div class="relative flex justify-center -mt-3">
                    <span class="text-slate-500 text-sm font-medium">O</span>
                </div>
            </div>
            
            <!-- Register link -->
            <div class="text-center">
                <p class="text-slate-400">
                    ¿No tenés cuenta? 
                    <a href="{% url 'register' %}" class="text-cyan-400 hover:text-cyan-300 font-medium transition">
                        Registrate acá
                    </a>
                </p>
            </div>
        </div>
        
        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="{% url 'home' %}" class="text-slate-500 hover:text-slate-300 text-sm transition">
                ← Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
