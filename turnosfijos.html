<button onclick="openFixedModal()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-purple-900/20">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    Cargar Turno Fijo
</button>

<div id="fixedModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-2xl rounded-2xl border border-slate-700 shadow-2xl flex flex-col max-h-[90vh]">
        
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <div>
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="bg-purple-600 text-white text-xs px-2 py-1 rounded">ADMIN</span>
                    Nuevo Turno Fijo
                </h3>
                <p class="text-gray-400 text-sm mt-1">Generación masiva de reservas sin pago previo.</p>
            </div>
            <button onclick="closeFixedModal()" class="text-gray-500 hover:text-white transition">✕</button>
        </div>

        <div class="p-6 overflow-y-auto custom-scrollbar space-y-6">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Cliente Fijo</label>
                    <input type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 outline-none" placeholder="Ej: Grupo de los Jueves">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Teléfono</label>
                    <input type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 outline-none" placeholder="Opcional">
                </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Cancha</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                        <option>Cancha 1 (Cristal)</option>
                        <option>Cancha 2 (Azul)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Hora Inicio</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none font-mono">
                        <option>19:00</option>
                        <option>20:00</option>
                        <option>21:00</option>
                    </select>
                </div>
                 <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Duración</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                        <option>60 min</option>
                        <option selected>90 min</option>
                        <option>120 min</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-purple-400 uppercase mb-3">¿Qué días juegan?</label>
                
                <div class="flex gap-2 mb-4">
                    <button class="flex-1 py-3 rounded-lg border border-slate-700 bg-slate-800 text-gray-400 hover:bg-slate-700 hover:text-white transition font-bold" onclick="toggleBtn(this)">Lun</button>
                    <button class="flex-1 py-3 rounded-lg border-2 border-purple-500 bg-purple-500/20 text-white font-bold shadow-lg shadow-purple-900/20" onclick="toggleBtn(this)">Mar</button> <button class="flex-1 py-3 rounded-lg border border-slate-700 bg-slate-800 text-gray-400 hover:bg-slate-700 hover:text-white transition font-bold" onclick="toggleBtn(this)">Mié</button>
                    <button class="flex-1 py-3 rounded-lg border-2 border-purple-500 bg-purple-500/20 text-white font-bold shadow-lg shadow-purple-900/20" onclick="toggleBtn(this)">Jue</button> <button class="flex-1 py-3 rounded-lg border border-slate-700 bg-slate-800 text-gray-400 hover:bg-slate-700 hover:text-white transition font-bold" onclick="toggleBtn(this)">Vie</button>
                    <button class="flex-1 py-3 rounded-lg border border-slate-700 bg-slate-800 text-gray-400 hover:bg-slate-700 hover:text-white transition font-bold" onclick="toggleBtn(this)">Sáb</button>
                    <button class="flex-1 py-3 rounded-lg border border-slate-700 bg-slate-800 text-gray-400 hover:bg-slate-700 hover:text-white transition font-bold" onclick="toggleBtn(this)">Dom</button>
                </div>

                <div class="flex items-center gap-3 text-sm">
                    <span class="text-gray-400">Repetir desde hoy hasta:</span>
                    <input type="date" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-white" value="2025-12-31">
                </div>
            </div>

            <div class="bg-blue-900/20 border border-blue-800 p-4 rounded-xl flex gap-4 items-start">
                <svg class="w-6 h-6 text-blue-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div>
                    <p class="text-blue-200 text-sm font-bold">Resumen de la operación:</p>
                    <p class="text-blue-300/80 text-xs mt-1">
                        Se van a generar <strong class="text-white">18 Reservas</strong> automáticamente para "Grupo de los Jueves".<br>
                        Estado: <span class="text-yellow-400">Pendiente de Pago (En mostrador)</span>.
                    </p>
                </div>
            </div>

        </div>

        <div class="p-6 border-t border-slate-800 flex justify-end gap-3">
            <button onclick="closeFixedModal()" class="px-6 py-3 rounded-xl text-gray-400 hover:text-white font-medium">Cancelar</button>
            <button class="px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold shadow-lg shadow-purple-900/40 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Confirmar y Generar
            </button>
        </div>
    </div>
</div>

<script>
    function openFixedModal() { document.getElementById('fixedModal').classList.remove('hidden'); }
    function closeFixedModal() { document.getElementById('fixedModal').classList.add('hidden'); }
    
    // Función visual para simular click en los días
    function toggleBtn(btn) {
        if (btn.classList.contains('border-purple-500')) {
            // Desactivar
            btn.classList.remove('border-2', 'border-purple-500', 'bg-purple-500/20', 'text-white', 'shadow-lg');
            btn.classList.add('border', 'border-slate-700', 'bg-slate-800', 'text-gray-400');
        } else {
            // Activar
            btn.classList.remove('border', 'border-slate-700', 'bg-slate-800', 'text-gray-400');
            btn.classList.add('border-2', 'border-purple-500', 'bg-purple-500/20', 'text-white', 'shadow-lg');
        }
    }
</script>
